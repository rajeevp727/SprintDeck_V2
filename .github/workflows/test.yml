name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      - name: API install
        working-directory: api
        run: npm install
