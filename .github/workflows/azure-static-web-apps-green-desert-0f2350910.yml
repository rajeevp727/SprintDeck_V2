name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

# Keep only the newest run for a PR or the main branch. A newer commit fully
# supersedes an in-progress frontend deployment, so concurrent runs waste SWA
# capacity and can surface as multiple deployments for the same change.
concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Production deploy only. PR staging environments are limited on the Free
  # SWA tier and fill up quickly with open Cursor/Dependabot PRs, which
  # otherwise fails every PR with "maximum number of staging environments".
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
          cp staticwebapp.config.json dist/staticwebapp.config.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        env:
          # Payee VPA injected into the frontend build from the repo secret UPI_ID.
          VITE_UPI_ID: ${{ secrets.UPI_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_DESERT_0F2350910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # Deploy Vite's compiled output, never the source index.html that
          # references /src/main.tsx. Serving that source file causes browsers
          # to reject it as application/octet-stream on Static Web Apps.
          app_location: "dist"
          api_location: "api" # Api source code path - optional
          output_location: "" # app_location already contains the built files
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  sync_email_settings:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    name: Sync email settings
    steps:
      - name: Check prerequisites
        id: gate
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$AZURE_CREDS" ] || [ -z "$RESEND_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping email sync — set AZURE_CREDENTIALS and RESEND_API_KEY GitHub secrets."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        if: steps.gate.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push email and APP_URL to SWA production
        if: steps.gate.outputs.enabled == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SWA_NAME: ${{ vars.AZURE_SWA_NAME }}
          SWA_RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          NAME="${SWA_NAME:-SprintDeck-Enterprise}"
          PUBLIC_URL="${APP_URL:-https://sprintdeck.in}"
          TENANT="${AZURE_TENANT_ID:-common}"
          if [ -z "${EMAIL_FROM:-}" ]; then
            echo "Set GitHub secret EMAIL_FROM."
            exit 1
          fi
          if [ -z "${SWA_RG:-}" ]; then
            echo "Set repository variable AZURE_RESOURCE_GROUP."
            exit 1
          fi
          echo "Syncing email settings to SWA: $NAME (resource group: $SWA_RG)"
          az staticwebapp appsettings set \
            --name "$NAME" \
            --resource-group "$SWA_RG" \
            --setting-names \
              "RESEND_API_KEY=${RESEND_API_KEY}" \
              "EMAIL_FROM=${EMAIL_FROM}" \
              "APP_URL=${PUBLIC_URL}" \
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}" \
              "AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}" \
              "AZURE_TENANT_ID=${TENANT}"
          echo "Verify: https://sprintdeck.in/api/auth/email-status"

  # PR validation without creating Azure staging environments.
  pr_build_job:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: PR Build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install and build app
        run: |
          npm ci
          npm run build
        env:
          VITE_UPI_ID: ${{ secrets.UPI_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      - name: Install API dependencies
        working-directory: api
        run: npm ci

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_DESERT_0F2350910 }}
          action: "close"
