name: Auto-merge Cursor PRs

on:
  workflow_run:
    workflows: [Tests, Aikido Security Scan, Azure Static Web Apps CI/CD]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge cursor/* PR when checks pass
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const branch = run.head_branch;
            const isCursor = branch?.startsWith('cursor/');
            const isDependabot = branch?.startsWith('dependabot/');
            if (!branch || (!isCursor && !isDependabot)) {
              core.info(`Skip auto-merge for branch ${branch || '(unknown)'}`);
              return;
            }

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 1,
            });
            if (!prs.length) {
              core.info('No open PR for this branch');
              return;
            }

            const pr = prs[0];
            if (pr.draft) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                draft: false,
              });
              core.info(`Marked PR #${pr.number} ready for review`);
            }

            // Approve when possible (may no-op if token cannot approve own PR).
            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: pr.number,
                event: 'APPROVE',
                body: 'Auto-approved by Cursor auto-merge workflow after required checks passed.',
              });
              core.info(`Approved PR #${pr.number}`);
            } catch (err) {
              core.info(`Approve skipped: ${err.message}`);
            }

            // Job names from workflows (not workflow display titles).
            // Build and Deploy is skipped on PRs (staging env limit); PR Build validates instead.
            const requiredAny = [
              ['test'],
              ['PR Build', 'Build and Deploy Job'],
            ];

            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: run.head_sha,
              per_page: 100,
            });

            const byName = new Map();
            for (const c of checks.check_runs) {
              const prev = byName.get(c.name);
              if (!prev || new Date(c.completed_at || 0) > new Date(prev.completed_at || 0)) {
                byName.set(c.name, c);
              }
            }

            const ok = (c) => c && (c.conclusion === 'success' || c.conclusion === 'skipped');

            for (const names of requiredAny) {
              const match = names.map((n) => byName.get(n)).find(ok);
              if (!match) {
                const seen = names.map((n) => `${n}=${byName.get(n)?.conclusion || 'missing'}`).join(', ');
                core.info(`Waiting on checks [${names.join(' | ')}] (${seen})`);
                return;
              }
            }

            // Fail closed if any non-skipped check failed on this SHA.
            const failed = checks.check_runs.filter(
              (c) => c.conclusion === 'failure' || c.conclusion === 'timed_out' || c.conclusion === 'cancelled',
            );
            if (failed.length) {
              core.info(`Not merging — failed checks: ${failed.map((c) => c.name).join(', ')}`);
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`Merged PR #${pr.number} (${branch})`);
            } catch (err) {
              const msg = String(err?.message || err);
              if (msg.includes('Merge already in progress') || msg.includes('Pull Request is not mergeable')) {
                core.info(`Merge skipped for PR #${pr.number}: ${msg}`);
                return;
              }
              throw err;
            }
