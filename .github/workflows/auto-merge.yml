name: Auto-merge Cursor PRs

on:
  workflow_run:
    workflows: [Tests, Aikido Security Scan]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge cursor/* PR when checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const branch = run.head_branch;
            if (!branch || !branch.startsWith('cursor/')) {
              core.info(`Skip auto-merge for branch ${branch || '(unknown)'}`);
              return;
            }

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 1,
            });
            if (!prs.length) {
              core.info('No open PR for this branch');
              return;
            }

            const pr = prs[0];
            if (pr.draft) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                draft: false,
              });
            }

            const required = ['Tests', 'Build and Deploy Job'];
            for (const checkName of required) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: run.head_sha,
                check_name: checkName,
                per_page: 1,
              });
              const check = data.check_runs[0];
              if (!check || (check.conclusion !== 'success' && check.conclusion !== 'skipped')) {
                core.info(`Waiting on check ${checkName} (got ${check?.conclusion || 'missing'})`);
                return;
              }
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
            });
            core.info(`Merged PR #${pr.number} (${branch})`);
